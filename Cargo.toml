[package]
name = "governor"
version = "2.0.0"
edition = "2021"
description = "AI-assisted development governance system — session lifecycle, context assembly, integrity validation"
authors = ["Governor Team"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "1"
dirs = "5"
hostname = "0.4"
ctrlc = "3"
arboard = "3"
toml = "0.8"
clap_complete = "4.5"
bytesize = "1"
fs2 = "0.4"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "governor"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
